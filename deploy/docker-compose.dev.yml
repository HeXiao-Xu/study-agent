# S0-4 开发环境基础服务：PostgreSQL 16（含 pgvector）+ Redis 7 + MinIO
# 用法（在仓库根目录执行，详见 deploy/README.md）：
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   python scripts/check_services.py

name: study-agent-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: study-agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study123}
      POSTGRES_DB: ${POSTGRES_DB:-study_agent}
    ports:
      # 只绑定本机回环，避免开发端口暴露到局域网
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 命名卷持久化（Windows 下避免绑定挂载的路径与权限坑）
      - pgdata:/var/lib/postgresql/data
      # pgvector 扩展必须在建表之前启用：首次初始化数据卷时自动执行
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study} -d ${POSTGRES_DB:-study_agent}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: study-agent-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    container_name: study-agent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-study}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-study123456}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # MinIO 本身不会自动创建 bucket：用官方 mc 客户端等 MinIO 就绪后创建（任务卡要求）
  minio-init:
    image: minio/mc
    container_name: study-agent-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-study}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-study123456}
      MINIO_BUCKET: ${MINIO_BUCKET:-study-agent}
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo waiting-for-minio; sleep 2;
        done;
        mc mb --ignore-existing local/$$MINIO_BUCKET;
        echo bucket $$MINIO_BUCKET ready;
      "

volumes:
  pgdata:
    name: study-agent-pgdata
  redisdata:
    name: study-agent-redisdata
  miniodata:
    name: study-agent-miniodata
